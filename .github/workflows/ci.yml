name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck senzu-access-setup.sh tests/*.sh

  containers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "ubuntu:22.04", "ubuntu:24.04"]
    steps:
      - uses: actions/checkout@v4
      - name: Install, open, close and uninstall over real SSH
        run: tests/run.sh "${{ matrix.image }}"
