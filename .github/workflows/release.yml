name: Release

# Push a tag vX.Y.Z matching VERSION in the script. The release carries the script and its
# SHA-256, which the README's install steps check.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck senzu-access-setup.sh tests/*.sh
      - run: tests/run.sh debian:12 ubuntu:24.04
      - name: Tag matches VERSION
        run: |
          version=$(sed -n 's/^readonly VERSION=//p' senzu-access-setup.sh)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, script $version"; exit 1; }
      - name: Notes and checksum
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          sha256sum senzu-access-setup.sh > senzu-access-setup.sh.sha256
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag \
            senzu-access-setup.sh senzu-access-setup.sh.sha256
